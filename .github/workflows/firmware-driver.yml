name: Download Linux Firmware SquashFS (Deduplicated)

on:
  schedule:
    - cron: '0 2 1 */2 *'
  workflow_dispatch:   # Only manual trigger

jobs:
  firmware:
    runs-on: ubuntu-latest

    container:
      image: debian:sid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y wget git squashfs-tools xz-utils ca-certificates python3

      - name: Download latest Linux firmware
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git linux-firmware-current

      - name: Deduplicate firmware files with symlinks (Python)
        shell: bash
        run: |
          python3 - <<'EOF'
          import hashlib
          import os

          def sha256sum(filename):
              h = hashlib.sha256()
              with open(filename, 'rb') as f:
                  while True:
                      chunk = f.read(8192)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          base_dir = 'linux-firmware-current'
          hashes = {}
          for root, dirs, files in os.walk(base_dir):
              for name in files:
                  path = os.path.join(root, name)
                  file_hash = sha256sum(path)
                  if file_hash in hashes:
                      original = hashes[file_hash]
                      rel_target = os.path.relpath(original, os.path.dirname(path))
                      os.remove(path)
                      os.symlink(rel_target, path)
                  else:
                      hashes[file_hash] = path
          EOF

      - name: Prepare SquashFS root
        run: |
          mkdir -p squashfs-root/usr/lib
          cp -a linux-firmware-current squashfs-root/usr/lib/firmware

      - name: Create SquashFS image with max XZ compression
        run: |
          mksquashfs squashfs-root linux-firmware-current.squashfs -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86

      - name: Package SquashFS into XZ-compressed tarball
        run: |
          tar -cJf linux-firmware-current.tar.xz linux-firmware-current.squashfs

      - name: Upload firmware tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-firmware-current
          path: linux-firmware-current.tar.xz
