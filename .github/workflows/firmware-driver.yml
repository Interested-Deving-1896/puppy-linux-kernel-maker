name: Linux Firmware Drivers SquashFS (Deduplicated + PC-Only)

on:
  schedule:
    - cron: '0 2 1 */2 *'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest

    container:
      image: debian:sid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y wget git squashfs-tools xz-utils ca-certificates python3

      - name: Download latest Linux firmware
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git linux-firmware-current

      - name: Remove non-PC and non-x86 firmware (Python)
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          import shutil

          base = "linux-firmware-current"

          # DIRECTORIES TO REMOVE (non-PC or non-x86)
          REMOVE_DIRS = [
              # ARM / phone / embedded
              "wil6210", "wcn36xx",
              # Automotive / industrial / IoT
              "adsp", "aspeed", "nvidia/tegra", "serial",
              # Server NICs not used for consumer PCs
              "liquidio", "cxgb3", "cxgb4", "qed",
              # Non-x86 architectures
              "mips", "powerpc", "riscv", "arm", "arm64",
              "ppc", "xtensa",
              # ChromeOS specific
              "google",
          ]

          # FILE PATTERN FILTERS — DELETE if filename contains these words
          REMOVE_PATTERNS = [
              "arm", "aarch64", "tegra", "tablet", "router",
              "fpga", "ml", "neural", "vr", "meta",
              "automotive", "industrial",
          ]

          # Remove directories
          for root, dirs, files in os.walk(base, topdown=True):
              for d in dirs:
                  full = os.path.join(root, d)
                  for bad in REMOVE_DIRS:
                      if bad in full.replace("\\", "/"):
                          shutil.rmtree(full, ignore_errors=True)
                          break

          # Remove files by keyword
          for root, dirs, files in os.walk(base):
              for f in files:
                  lower = f.lower()
                  if any(p in lower for p in REMOVE_PATTERNS):
                      try:
                          os.remove(os.path.join(root, f))
                      except:
                          pass

          EOF

      - name: Deduplicate firmware files (Python)
        run: |
          python3 - <<'EOF'
          import hashlib, os

          def sha256sum(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      b = f.read(8192)
                      if not b: break
                      h.update(b)
              return h.hexdigest()

          base = "linux-firmware-current"
          hashes = {}

          for root, dirs, files in os.walk(base):
              for f in files:
                  p = os.path.join(root, f)
                  h = sha256sum(p)
                  if h in hashes:
                      original = hashes[h]
                      rel = os.path.relpath(original, os.path.dirname(p))
                      os.remove(p)
                      os.symlink(rel, p)
                  else:
                      hashes[h] = p
          EOF

      - name: Prepare SquashFS root
        run: |
          mkdir -p squashfs-root/lib
          mkdir -p squashfs-root-usrmerge/usr/lib
          cp -a linux-firmware-current squashfs-root/lib/firmware
          cp -a linux-firmware-current squashfs-root-usrmerge/usr/lib/firmware
          rm -rf squashfs-root/lib/firmware/.git*
          rm -f squashfs-root/lib/firmware/.editorconfig
          rm -f squashfs-root/lib/firmware/.codespell*
          rm -f squashfs-root/lib/firmware/.pre-commit*
          rm -rf squashfs-root-usrmerge/usr/lib/firmware/.git*
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.editorconfig
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.codespell*
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.pre-commit*
          
      - name: Create SquashFS image (XZ max compression)
        run: |
          mksquashfs squashfs-root linux-firmware-pconly.sfs \
            -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86
          mksquashfs squashfs-root-usrmerge linux-firmware-pconly-usrmerge.sfs \
            -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86            

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: linux-firmware-pconly
          path: |
                *.sfs
