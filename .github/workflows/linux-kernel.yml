name: Linux Kernel Build + Modules + SquashFS

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:sid

    env:
      BASE_VERSION: 6.18   # Fixed major.minor kernel version
      CUSTOM_VERSION: foo   # Custom suffix for kernel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves pahole \
            squashfs-tools wget xz-utils ca-certificates gcc g++ binutils \
            llvm clang kmod python3

      - name: Detect latest patch for $BASE_VERSION
        id: detect_kernel
        run: |
          LATEST=$(curl -s https://www.kernel.org/releases.json \
            | python3 -c "import sys,json; data=json.load(sys.stdin); \
for r in data['releases']: \
    if r['version'].startswith('${BASE_VERSION}.'): print(r['version'])" \
            | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No release found for ${BASE_VERSION}. Exiting."
            exit 1
          fi
          echo "Latest kernel patch: $LATEST"
          echo "KERNEL_VERSION=$LATEST" >> $GITHUB_ENV

      - name: Download Linux kernel
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v${BASE_VERSION%%.*}.x/linux-$KERNEL_VERSION.tar.xz
          tar -xf linux-$KERNEL_VERSION.tar.xz
          mv linux-$KERNEL_VERSION linux

      - name: Copy provided .config
        run: cp .config linux/.config

      - name: Auto-update config (unattended)
        working-directory: linux
        run: yes "" | make olddefconfig

      - name: Set custom version string
        working-directory: linux
        run: echo "-${CUSTOM_VERSION}" > .config.localversion

      - name: Build kernel image
        working-directory: linux
        run: make -j"$(nproc)" bzImage

      - name: Build modules
        working-directory: linux
        run: make modules -j"$(nproc)"

      - name: Install modules into staging directory
        working-directory: linux
        run: |
          mkdir -p ../staging
          make modules_install INSTALL_MOD_PATH=../staging

      - name: Strip unneeded symbols from modules
        run: |
          KMOD_VERSION="$KERNEL_VERSION-$(cat linux/.config.localversion)"
          MODULES_DIR=staging/lib/modules/$KMOD_VERSION
          find $MODULES_DIR -type f -name '*.ko' -exec strip --strip-unneeded {} \;

      - name: Prepare SquashFS root
        run: |
          KMOD_VERSION="$KERNEL_VERSION-$(cat linux/.config.localversion)"
          mkdir -p squashfs-root/usr/lib/modules
          cp -a staging/lib/modules/$KMOD_VERSION squashfs-root/usr/lib/modules/
          mkdir -p squashfs-root/boot
          cp linux/arch/x86/boot/bzImage squashfs-root/boot/vmlinuz

      - name: Create SquashFS image with max XZ compression
        run: |
          KMOD_VERSION="$KERNEL_VERSION-$(cat linux/.config.localversion)"
          mksquashfs squashfs-root huge-kernel-${KMOD_VERSION}.sfs \
            -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86

      - name: Package SquashFS into XZ-compressed tarball
        run: |
          KMOD_VERSION="$KERNEL_VERSION-$(cat linux/.config.localversion)"
          tar -cJf huge-kernel-${KMOD_VERSION}.tar.xz huge-kernel-${KMOD_VERSION}.sfs

      - name: Upload final tarball
        uses: actions/upload-artifact@v4
        with:
          name: huge-kernel-${KMOD_VERSION}
          path: huge-kernel-${KMOD_VERSION}.tar.xz
